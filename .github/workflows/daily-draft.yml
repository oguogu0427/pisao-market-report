
name: Japanese Market Report - Hatena Draft

on:
  workflow_dispatch:
    inputs:
      report_html:
        description: "ChatGPTで作成した既定フォーマットのHTML"
        required: true
        type: string

permissions:
  contents: read

jobs:
  hatena-draft:
    runs-on: ubuntu-latest

    steps:
      - name: Save report to Hatena
        env:
          REPORT_HTML: ${{ inputs.report_html }}
          OWNER_API_KEY: ${{ secrets.OWNER_API_KEY }}
          BLOG_DOMAIN: ${{ secrets.BLOG_DOMAIN }}
        run: |
          python3 <<'PY'
          import os
          import sys
          import base64
          import html.parser
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET

          report = os.environ["REPORT_HTML"]
          api_key = os.environ["OWNER_API_KEY"]
          domain = os.environ["BLOG_DOMAIN"]

          if not report.strip():
              sys.exit("HTML report is empty")

          class TitleParser(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.title = ""
                  self.active = False

              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "title":
                      self.active = True

              def handle_endtag(self, tag):
                  if tag.lower() == "title":
                      self.active = False

              def handle_data(self, data):
                  if self.active:
                      self.title += data

          parser = TitleParser()
          parser.feed(report)
          title = parser.title.strip() or "日本株 朝の相場レポート"

          atom = "http://www.w3.org/2005/Atom"
          app = "http://www.w3.org/2007/app"

          ET.register_namespace("", atom)
          ET.register_namespace("app", app)

          entry = ET.Element(f"{{{atom}}}entry")

          ET.SubElement(entry, f"{{{atom}}}title").text = title

          author = ET.SubElement(entry, f"{{{atom}}}author")
          ET.SubElement(author, f"{{{atom}}}name").text = "Pisao"

          ET.SubElement(
              entry,
              f"{{{atom}}}content",
              {"type": "text/html"}
          ).text = report

          control = ET.SubElement(entry, f"{{{app}}}control")
          ET.SubElement(
              control,
              f"{{{app}}}draft"
          ).text = "yes"

          body = ET.tostring(
              entry,
              encoding="utf-8",
              xml_declaration=True
          )

          url = f"https://blog.hatena.ne.jp/Pisao/{domain}/atom/entry"

          credentials = base64.b64encode(
              f"Pisao:{api_key}".encode()
          ).decode()

          request = urllib.request.Request(
              url,
              data=body,
              headers={
                  "Authorization": f"Basic {credentials}",
                  "Content-Type": "application/atom+xml; charset=utf-8"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  print("Hatena draft saved successfully.")
                  print("HTTP status:", response.status)
          except urllib.error.HTTPError as error:
              print("Hatena API error:", error.code)
              print(error.read().decode("utf-8", errors="replace"))
              sys.exit(1)
          PY
