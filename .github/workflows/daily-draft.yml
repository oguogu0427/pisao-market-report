name: Receive Japanese Market Report

on:
  repository_dispatch:
    types: [hatena-draft]

  workflow_dispatch:

jobs:
  receive-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Save report HTML
        env:
          REPORT_HTML: ${{ github.event.client_payload.html }}
        run: |
          if [ -z "$REPORT_HTML" ]; then
            echo "HTML report is empty"
            exit 1
          fi

          mkdir -p reports
          printf '%s' "$REPORT_HTML" > reports/latest-report.html

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/latest-report.html
          git commit -m "Update morning market report" || echo "No changes"
          git push
