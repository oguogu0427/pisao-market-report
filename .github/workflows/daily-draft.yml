
name: Japanese Market Report

on:
  workflow_dispatch:
  schedule:
    - cron: '30 22 * * 0-4'

permissions:
  contents: read

jobs:
  create-and-save-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install yfinance requests

      - name: Create market report
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cat > create_report.py <<'PY'
          import os
          import json
          import requests
          import yfinance as yf
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from html import escape

          JST = ZoneInfo("Asia/Tokyo")
          now = datetime.now(JST)
          date_text = now.strftime("%Y年%m月%d日")
          date_iso = now.strftime("%Y-%m-%d")

          tickers = {
              "日経平均": "^N225",
              "TOPIX連動ETF": "1306.T",
              "NYダウ": "^DJI",
              "S&P500": "^GSPC",
              "NASDAQ": "^IXIC",
              "ドル円": "JPY=X"
          }

          market_data = {}

          for name, symbol in tickers.items():
              try:
                  hist = yf.Ticker(symbol).history(period="5d")
                  if hist.empty:
                      market_data[name] = {"status": "データ取得不可"}
                      continue

                  latest = hist.iloc[-1]
                  previous = hist.iloc[-2] if len(hist) >= 2 else latest

                  close = float(latest["Close"])
                  prev_close = float(previous["Close"])
                  change = close - prev_close
                  change_pct = (
                      change / prev_close * 100
                      if prev_close else 0
                  )

                  market_data[name] = {
                      "date": str(hist.index[-1].date()),
                      "close": round(close, 3),
                      "change": round(change, 3),
                      "change_percent": round(change_pct, 2),
                      "volume": int(latest["Volume"])
                  }

              except Exception as e:
                  market_data[name] = {
                      "status": "取得エラー",
                      "detail": str(e)
                  }

          if not any("close" in v for v in market_data.values()):
              raise RuntimeError("市場データを取得できませんでした")

          prompt = f"""
          あなたは日本株市場を専門とするプロのマーケットアナリストです。

          {date_text} 朝刊向けの日本株市場レポートを作成してください。

          【市場データ】
          {json.dumps(market_data, ensure_ascii=False, indent=2)}

          【レポート仕様】
          次の8章を必ずすべて作成してください。

          1. 昨日の日本市場を振り返る
          2. 本日の日本市場の展望
          3. 海外市場・為替・先物の動向
          4. 本日の主要イベント
          5. 本日の決算発表情報
          6. 本日の相場で警戒したいポイント
          7. 本日の注目銘柄10選
          8. 本日のまとめ

          【詳細条件】

          ・市場データを具体的な数値で分析する。
          ・前日比、騰落率、為替水準を記載する。
          ・日本株への影響を具体的に説明する。
          ・海外市場の動向と日本市場への波及を分析する。
          ・本日のイベントと決算情報を調査して記載する。
          ・確認できた情報には情報源のURLを記載する。
          ・情報が取得できない項目は「情報確認中」と記載する。
          ・推測を事実として記載しない。
          ・第7章は上昇期待5銘柄、下落警戒5銘柄。
          ・各銘柄について、コード、企業名、選定理由、
            注目材料、警戒材料を具体的に記載する。
          ・銘柄選定は市場環境と関連付ける。
          ・抽象的な文章や同じ内容の繰り返しを避ける。
          ・投資判断に役立つ分析を十分な分量で記載する。
          ・日本語で執筆する。

          【HTML出力条件】

          HTML本文の断片だけを出力してください。
          Markdownコードブロックは使用しないでください。

          第1章から第8章まで、それぞれ
          <section class="chapter"> で囲んでください。
          各章の見出しは <h2> を使用してください。
          小見出しは <h3> を使用してください。
          表は <table> を使用してください。
          重要事項は <div class="point"> で囲んでください。
          文章は <p>、箇条書きは <ul><li> を使用してください。

          第7章は10銘柄を表形式で掲載してください。
          """
          
          api_key = os.environ["OPENAI_API_KEY"]

          payload = {
              "model": "gpt-4.1",
              "input": [
                  {
                      "role": "system",
                      "content": (
                          "あなたは正確性と具体性を重視する"
                          "日本株市場専門の金融アナリストです。"
                      )
                  },
                  {
                      "role": "user",
                      "content": prompt
                  }
              ],
              "tools": [
                  {"type": "web_search_preview"}
              ]
          }

          response = requests.post(
              "https://api.openai.com/v1/responses",
              headers={
                  "Authorization": f"Bearer {api_key}",
                  "Content-Type": "application/json"
              },
              json=payload,
              timeout=300
          )

          response.raise_for_status()
          result = response.json()

          parts = []
          for item in result.get("output", []):
              if item.get("type") == "message":
                  for content in item.get("content", []):
                      if content.get("type") == "output_text":
                          parts.append(content.get("text", ""))

          report_body = "\n".join(parts).strip()

          if not report_body:
              raise RuntimeError("レポート本文の生成に失敗しました")

          if "<section" not in report_body or report_body.count(
              'class="chapter"'
          ) < 8:
              raise RuntimeError("8章構成のHTMLを確認できません")

          css = """
          body {
            margin: 0;
            padding: 24px 16px;
            background: #f3f5f8;
            color: #273142;
            font-family: -apple-system, BlinkMacSystemFont,
              "Helvetica Neue", "Yu Gothic", sans-serif;
            line-height: 1.9;
          }
          .report {
            max-width: 900px;
            margin: 0 auto;
            padding: 36px;
            background: #ffffff;
            border-radius: 8px;
          }
          .report-header {
            padding: 28px 0;
            border-bottom: 3px solid #183b64;
            margin-bottom: 30px;
          }
          .brand {
            color: #315b83;
            font-size: 13px;
            letter-spacing: 3px;
            font-weight: bold;
          }
          h1 {
            font-size: 30px;
            color: #183b64;
            margin: 12px 0;
          }
          .date {
            color: #68778a;
          }
          .chapter {
            margin: 38px 0;
          }
          h2 {
            padding: 12px 16px;
            background: #183b64;
            color: #ffffff;
            font-size: 21px;
            border-radius: 4px;
          }
          h3 {
            color: #244f78;
            border-left: 4px solid #6689ad;
            padding-left: 12px;
            margin-top: 26px;
          }
          p {
            margin: 14px 0;
          }
          table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            font-size: 14px;
          }
          th, td {
            border: 1px solid #d9e0e8;
            padding: 10px;
            text-align: left;
          }
          th {
            background: #eaf0f6;
            color: #183b64;
          }
          .point {
            background: #eef4fa;
            border-left: 4px solid #315b83;
            padding: 15px 18px;
            margin: 18px 0;
          }
          li {
            margin: 7px 0;
          }
          .disclaimer {
            margin-top: 40px;
            padding-top: 18px;
            border-top: 1px solid #d9e0e8;
            color: #68778a;
            font-size: 12px;
          }
          @media(max-width:600px) {
            body { padding: 8px; }
            .report { padding: 18px; }
            h1 { font-size: 24px; }
            table { font-size: 12px; }
            th, td { padding: 6px; }
          }
          """

          html = f"""<!DOCTYPE html>
          <html lang="ja">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>日本株 朝の相場レポート {date_text}</title>
          <style>{css}</style>
          </head>
          <body>
          <main class="report">
          <header class="report-header">
          <div class="brand">MARKET MORNING REPORT</div>
          <h1>日本株 朝の相場レポート</h1>
          <div class="date">{date_text}</div>
          <p>国内外の市場動向と本日の投資戦略</p>
          </header>
          <p>[:contents]</p>
          {report_body}
          <footer class="disclaimer">
          本レポートは情報提供を目的として作成しています。
          投資判断はご自身の責任で行ってください。
          </footer>
          </main>
          </body>
          </html>
          """

          with open("report.html", "w", encoding="utf-8") as f:
              f.write(html)

          print("レポート作成完了:", date_iso)
          print("HTML文字数:", len(html))
          PY

          python create_report.py

      - name: Publish Hatena draft
        env:
          OWNER_API_KEY: ${{ secrets.OWNER_API_KEY }}
          BLOG_DOMAIN: ${{ secrets.BLOG_DOMAIN }}
        run: |
          python <<'PY'
          import os
          import sys
          import base64
          import html.parser
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET

          with open("report.html", encoding="utf-8") as f:
              report = f.read()

          if not report.strip():
              sys.exit("Report is empty")

          class Parser(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.title = ""
                  self.active = False

              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "title":
                      self.active = True

              def handle_endtag(self, tag):
                  if tag.lower() == "title":
                      self.active = False

              def handle_data(self, data):
                  if self.active:
                      self.title += data

          parser = Parser()
          parser.feed(report)
          title = parser.title.strip()

          atom = "http://www.w3.org/2005/Atom"
          app = "http://www.w3.org/2007/app"

          ET.register_namespace("", atom)
          ET.register_namespace("app", app)

          entry = ET.Element(f"{{{atom}}}entry")
          ET.SubElement(
              entry, f"{{{atom}}}title"
          ).text = title

          author = ET.SubElement(
              entry, f"{{{atom}}}author"
          )
          ET.SubElement(
              author, f"{{{atom}}}name"
          ).text = "Pisao"

          ET.SubElement(
              entry,
              f"{{{atom}}}content",
              {"type": "text/html"}
          ).text = report

          control = ET.SubElement(
              entry, f"{{{app}}}control"
          )
          ET.SubElement(
              control, f"{{{app}}}draft"
          ).text = "yes"

          body = ET.tostring(
              entry,
              encoding="utf-8",
              xml_declaration=True
          )

          domain = os.environ["BLOG_DOMAIN"]
          key = os.environ["OWNER_API_KEY"]

          endpoint = (
              f"https://blog.hatena.ne.jp/Pisao/{domain}/atom/entry"
          )

          token = base64.b64encode(
              f"Pisao:{key}".encode()
          ).decode()

          request = urllib.request.Request(
              endpoint,
              data=body,
              headers={
                  "Authorization": f"Basic {token}",
                  "Content-Type": "application/atom+xml; charset=utf-8"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(
                  request, timeout=60
              ) as response:
                  print("Hatena draft saved:", response.status)
                  print(response.read().decode(
                      "utf-8", errors="replace"
                  ))
          except urllib.error.HTTPError as error:
              print("Hatena API error:", error.code)
              print(error.read().decode(
                  "utf-8", errors="replace"
              ))
              sys.exit(1)
          PY
