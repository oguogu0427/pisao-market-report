
name: Japanese Market Report

on:
  workflow_dispatch:
  schedule:
    - cron: '30 22 * * 0-4'

permissions:
  contents: read

jobs:
  create-and-save-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance

      - name: Generate report and save to Hatena
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OWNER_API_KEY: ${{ secrets.OWNER_API_KEY }}
          BLOG_DOMAIN: ${{ secrets.BLOG_DOMAIN }}
        run: |
          cat > report.py <<'PY'
          import os
          import sys
          import json
          import base64
          import requests
          import yfinance as yf
          import xml.etree.ElementTree as ET
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from html.parser import HTMLParser

          JST = ZoneInfo("Asia/Tokyo")
          now = datetime.now(JST)
          date_text = now.strftime("%Y年%m月%d日")

          # 1. 市場データ取得
          symbols = {
              "日経平均": "^N225",
              "TOPIX連動ETF": "1306.T",
              "NYダウ": "^DJI",
              "S&P500": "^GSPC",
              "NASDAQ": "^IXIC",
              "ドル円": "JPY=X"
          }

          market = {}

          for name, symbol in symbols.items():
              try:
                  data = yf.Ticker(symbol).history(period="5d")
                  if data.empty:
                      raise ValueError("データなし")

                  latest = data.iloc[-1]
                  previous = data.iloc[-2] if len(data) >= 2 else latest

                  close = float(latest["Close"])
                  prev = float(previous["Close"])

                  market[name] = {
                      "終値": round(close, 3),
                      "前日比": round(close - prev, 3),
                      "騰落率": round(
                          (close - prev) / prev * 100, 2
                      ) if prev else 0,
                      "日付": str(data.index[-1].date())
                  }
              except Exception as e:
                  market[name] = {"取得状況": str(e)}

          if not any("終値" in x for x in market.values()):
              raise RuntimeError("市場データ取得に失敗しました")

          # 2. レポート生成
          prompt = f"""
          本日の日付：{date_text}

          市場データ：
          {json.dumps(market, ensure_ascii=False, indent=2)}

          あなたは日本株市場専門の金融アナリストです。
          上記データと最新の公開情報を調査し、
          日本株の朝の相場レポートを作成してください。

          必ず次の8章をすべて作成してください。

          1. 昨日の日本市場を振り返る
          2. 本日の日本市場の展望
          3. 海外市場・為替・先物の動向
          4. 本日の主要イベント
          5. 本日の決算発表情報
          6. 本日の相場で警戒したいポイント
          7. 本日の注目銘柄10選
          8. 本日のまとめ

          【内容の条件】

          ・市場データを数値で具体的に分析する。
          ・国内外の市場動向を日本株への影響と結び付ける。
          ・主要イベントと決算情報は日付を明記する。
          ・イベントと決算は最新情報を検索して確認する。
          ・取得できない情報は「情報確認中」と記載する。
          ・第7章は上昇期待5銘柄、下落警戒5銘柄。
          ・銘柄コード、企業名、選定理由、注目材料、
            警戒材料を記載する。
          ・各章は十分な分析量を確保する。
          ・同じ説明を繰り返さない。
          ・推測と確認済み情報を区別する。

          【HTML形式】

          HTML本文の断片のみを出力する。
          Markdownコードブロックは禁止。

          各章を <section class="chapter"> で囲む。
          章見出しは <h2>。
          小見出しは <h3>。
          表は <table>。
          本文は <p>。
          箇条書きは <ul><li>。
          重要事項は <div class="point"> で囲む。

          第7章は10銘柄の表を作成する。
          8章すべてを省略せず作成する。
          """

          api_key = os.environ["OPENAI_API_KEY"]

          response = requests.post(
              "https://api.openai.com/v1/responses",
              headers={
                  "Authorization": f"Bearer {api_key}",
                  "Content-Type": "application/json"
              },
              json={
                  "model": "gpt-4.1",
                  "tools": [
                      {"type": "web_search_preview"}
                  ],
                  "input": prompt
              },
              timeout=300
          )

          response.raise_for_status()
          result = response.json()

          texts = []
          for item in result.get("output", []):
              if item.get("type") == "message":
                  for part in item.get("content", []):
                      if part.get("type") == "output_text":
                          texts.append(part.get("text", ""))

          body = "\n".join(texts).strip()

          if not body:
              raise RuntimeError("レポート本文が空です")

          if body.count('class="chapter"') < 8:
              raise RuntimeError("8章構成を確認できません")

          # 3. HTML整形
          css = """
          body {
            margin: 0;
            padding: 24px 16px;
            background: #f3f5f8;
            color: #273142;
            font-family: -apple-system, BlinkMacSystemFont,
              "Helvetica Neue", "Yu Gothic", sans-serif;
            line-height: 1.9;
          }
          .report {
            max-width: 900px;
            margin: 0 auto;
            padding: 36px;
            background: #fff;
            border-radius: 8px;
          }
          .report-header {
            padding: 28px 0;
            border-bottom: 3px solid #183b64;
            margin-bottom: 30px;
          }
          .brand {
            color: #315b83;
            font-size: 13px;
            letter-spacing: 3px;
            font-weight: bold;
          }
          h1 {
            font-size: 30px;
            color: #183b64;
            margin: 12px 0;
          }
          .date { color: #68778a; }
          .chapter { margin: 38px 0; }
          h2 {
            padding: 12px 16px;
            background: #183b64;
            color: white;
            font-size: 21px;
            border-radius: 4px;
          }
          h3 {
            color: #244f78;
            border-left: 4px solid #6689ad;
            padding-left: 12px;
            margin-top: 26px;
          }
          p { margin: 14px 0; }
          table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            font-size: 14px;
          }
          th, td {
            border: 1px solid #d9e0e8;
            padding: 10px;
            text-align: left;
          }
          th {
            background: #eaf0f6;
            color: #183b64;
          }
          .point {
            background: #eef4fa;
            border-left: 4px solid #315b83;
            padding: 15px 18px;
            margin: 18px 0;
          }
          li { margin: 7px 0; }
          .disclaimer {
            margin-top: 40px;
            padding-top: 18px;
            border-top: 1px solid #d9e0e8;
            color: #68778a;
            font-size: 12px;
          }
          @media(max-width:600px) {
            body { padding: 8px; }
            .report { padding: 18px; }
            h1 { font-size: 24px; }
            table { font-size: 12px; }
            th, td { padding: 6px; }
          }
          """

          html = f"""<!DOCTYPE html>
          <html lang="ja">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>日本株 朝の相場レポート {date_text}</title>
          <style>{css}</style>
          </head>
          <body>
          <main class="report">
          <header class="report-header">
          <div class="brand">MARKET MORNING REPORT</div>
          <h1>日本株 朝の相場レポート</h1>
          <div class="date">{date_text}</div>
          <p>国内外の市場動向と本日の投資戦略</p>
          </header>
          <p>[:contents]</p>
          {body}
          <footer class="disclaimer">
          本レポートは情報提供を目的として作成しています。
          投資判断はご自身の責任で行ってください。
          </footer>
          </main>
          </body>
          </html>"""

          with open("report.html", "w", encoding="utf-8") as f:
              f.write(html)

          print("レポート生成完了:", len(html), "文字")

          # 4. Hatena下書き保存
          class TitleParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.active = False
                  self.title = ""

              def handle_starttag(self, tag, attrs):
                  if tag == "title":
                      self.active = True

              def handle_endtag(self, tag):
                  if tag == "title":
                      self.active = False

              def handle_data(self, data):
                  if self.active:
                      self.title += data

          parser = TitleParser()
          parser.feed(html)
          title = parser.title.strip()

          atom = "http://www.w3.org/2005/Atom"
          app = "http://www.w3.org/2007/app"

          ET.register_namespace("", atom)
          ET.register_namespace("app", app)

          entry = ET.Element(f"{{{atom}}}entry")
          ET.SubElement(entry, f"{{{atom}}}title").text = title

          author = ET.SubElement(entry, f"{{{atom}}}author")
          ET.SubElement(entry, f"{{{atom}}}name").text = "Pisao"

          ET.SubElement(
              entry,
              f"{{{atom}}}content",
              {"type": "text/html"}
          ).text = html

          control = ET.SubElement(entry, f"{{{app}}}control")
          ET.SubElement(control, f"{{{app}}}draft").text = "yes"

          xml_body = ET.tostring(
              entry,
              encoding="utf-8",
              xml_declaration=True
          )

          token = base64.b64encode(
              (
                  "Pisao:" + os.environ["OWNER_API_KEY"]
              ).encode()
          ).decode()

          endpoint = (
              "https://blog.hatena.ne.jp/Pisao/"
              + os.environ["BLOG_DOMAIN"]
              + "/atom/entry"
          )

          req = requests.post(
              endpoint,
              data=xml_body,
              headers={
                  "Authorization": "Basic " + token,
                  "Content-Type": "application/atom+xml; charset=utf-8"
              },
              timeout=60
          )

          if not req.ok:
              print("Hatena API error:", req.status_code)
              print(req.text)
              sys.exit(1)

          print("Hatena下書き保存成功")
          print(req.text)
          PY

          python report.py
