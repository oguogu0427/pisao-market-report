name: Japanese Stock Market Report

on:
  workflow_dispatch:
  schedule:
    # 平日 07:30（日本時間）
    - cron: '30 22 * * 0-4'

permissions:
  contents: read

concurrency:
  group: japanese-stock-market-report
  cancel-in-progress: false

jobs:
  save-hatena-draft:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check report.html
        run: |
          if [ ! -s report.html ]; then
            echo "report.html が見つかりません。"
            exit 1
          fi

      - name: Create Hatena AtomPub entry
        env:
          TZ: Asia/Tokyo
        run: |
          set -euo pipefail

          TITLE="日本株 朝の相場レポート $(date +'%Y年%m月%d日')"

          {
            printf '%s\n' \
              '<?xml version="1.0" encoding="utf-8"?>' \
              '<entry xmlns="http://www.w3.org/2005/Atom" xmlns:app="http://www.w3.org/2007/app">'

            printf '  <title>%s</title>\n' "$TITLE"

            printf '%s\n' \
              '  <author><name>ChatGPT</name></author>' \
              '  <content type="text/html"><![CDATA['

            cat report.html

            printf '%s\n' \
              ']]></content>' \
              '  <app:control><app:draft>yes</app:draft></app:control>' \
              '</entry>'
          } > hatena-entry.xml

      - name: Save HTML draft to Hatena
        env:
          HATENA_USER: Pisao
          HATENA_API_KEY: ${{ secrets.OWNER_API_KEY }}
          BLOG_DOMAIN: ${{ secrets.BLOG_DOMAIN }}
        run: |
          set -euo pipefail

          if [ -z "$HATENA_API_KEY" ] || [ -z "$BLOG_DOMAIN" ]; then
            echo "Hatena接続用Secretsを確認してください。"
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --user "${HATENA_USER}:${HATENA_API_KEY}" \
            --request POST \
            --header "Content-Type: application/atom+xml; charset=utf-8" \
            --data-binary @hatena-entry.xml \
            "https://blog.hatena.ne.jp/${HATENA_USER}/${BLOG_DOMAIN}/atom/entry"
