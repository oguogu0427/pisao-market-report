
name: Japanese Market Report

on:
  workflow_dispatch:
  schedule:
    - cron: '30 22 * * 0-4'

permissions:
  contents: read

jobs:
  create-and-save:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install packages
        run: |
          pip install requests yfinance

      - name: Generate report
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cat > generate.py <<'PY'
          import os
          import re
          import json
          import requests
          import yfinance as yf
          from datetime import datetime
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("Asia/Tokyo"))
          date = now.strftime("%Y年%m月%d日")

          symbols = {
              "日経平均": "^N225",
              "TOPIX": "1306.T",
              "NYダウ": "^DJI",
              "S&P500": "^GSPC",
              "NASDAQ": "^IXIC",
              "ドル円": "JPY=X"
          }

          market = {}

          for name, symbol in symbols.items():
              try:
                  hist = yf.Ticker(symbol).history(period="5d")
                  if hist.empty:
                      market[name] = {"status": "取得不可"}
                      continue

                  latest = hist.iloc[-1]
                  prev = hist.iloc[-2] if len(hist) > 1 else latest
                  close = float(latest["Close"])
                  before = float(prev["Close"])

                  market[name] = {
                      "date": str(hist.index[-1].date()),
                      "close": round(close, 3),
                      "change": round(close - before, 3),
                      "change_percent": round(
                          (close / before - 1) * 100, 2
                      ) if before else 0
                  }
              except Exception as e:
                  market[name] = {"status": str(e)}

          if not any("close" in x for x in market.values()):
              raise RuntimeError("市場データ取得に失敗しました")

          prompt = f"""
          あなたは日本株専門のマーケットアナリストです。

          作成日：{date}

          市場データ：
          {json.dumps(market, ensure_ascii=False, indent=2)}

          最新の公開情報をWeb検索し、朝の日本株市場レポートを
          日本語で作成してください。

          必ず次の8章を、この順番で作成してください。

          第1章 昨日の日本市場を振り返る
          第2章 本日の日本市場の展望
          第3章 海外市場・為替・先物の動向
          第4章 本日の主要イベント
          第5章 本日の決算発表情報
          第6章 本日の相場で警戒したいポイント
          第7章 本日の注目銘柄10選
          第8章 本日のまとめ

          【執筆基準】

          ・各章に具体的な分析と根拠を記載する。
          ・市場データは数値と前日比を明記する。
          ・海外市場、為替、先物の影響を分析する。
          ・イベントと決算情報は対象日を確認する。
          ・確認できない情報は情報確認中と記載する。
          ・架空の数値やニュースを作らない。
          ・第7章は上昇期待5銘柄、下落警戒5銘柄。
          ・各銘柄にコード、企業名、選定理由、
            注目材料、警戒材料を記載する。
          ・各章を十分な分量で具体的に執筆する。
          ・同じ説明の繰り返しを避ける。

          【HTML仕様】

          HTML本文の断片だけを出力してください。
          Markdownのコードフェンスは禁止です。

          各章を <section class="chapter"> で囲む。
          見出しは <h2>、小見出しは <h3>。
          本文は <p>、表は <table>。
          箇条書きは <ul><li>。
          重要事項は <div class="point"> で囲む。
          第7章は10銘柄の表を作成する。
          """

          response = requests.post(
              "https://api.openai.com/v1/responses",
              headers={
                  "Authorization": "Bearer " + os.environ["OPENAI_API_KEY"],
                  "Content-Type": "application/json"
              },
              json={
                  "model": "gpt-4.1",
                  "tools": [{"type": "web_search_preview"}],
                  "input": prompt
              },
              timeout=300
          )
          response.raise_for_status()

          result = response.json()
          parts = []

          for item in result.get("output", []):
              if item.get("type") == "message":
                  for content in item.get("content", []):
                      if content.get("type") == "output_text":
                          parts.append(content.get("text", ""))

          body = "\n".join(parts).strip()
          body = re.sub(r"^```(?:html)?\s*", "", body)
          body = re.sub(r"\s*```$", "", body)

          chapters = re.findall(
              r'<section\s+class=["\']chapter["\']',
              body
          )

          if len(chapters) != 8:
              raise RuntimeError(
                  f"8章構成を確認できません。検出数: {len(chapters)}"
              )

          css = """
          body {
            margin: 0;
            padding: 24px 16px;
            background: #f3f5f8;
            color: #273142;
            font-family: -apple-system, BlinkMacSystemFont,
              "Helvetica Neue", "Yu Gothic", sans-serif;
            line-height: 1.9;
          }
          .report {
            max-width: 900px;
            margin: 0 auto;
            padding: 36px;
            background: #ffffff;
            border-radius: 8px;
          }
          .report-header {
            padding: 28px 0;
            border-bottom: 3px solid #183b64;
            margin-bottom: 30px;
          }
          .brand {
            color: #315b83;
            font-size: 13px;
            letter-spacing: 3px;
            font-weight: bold;
          }
          h1 {
            font-size: 30px;
            color: #183b64;
            margin: 12px 0;
          }
          .date { color: #68778a; }
          .chapter { margin: 38px 0; }
          h2 {
            padding: 12px 16px;
            background: #183b64;
            color: #ffffff;
            font-size: 21px;
            border-radius: 4px;
          }
          h3 {
            color: #244f78;
            border-left: 4px solid #6689ad;
            padding-left: 12px;
            margin-top: 26px;
          }
          p { margin: 14px 0; }
          table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            font-size: 14px;
          }
          th, td {
            border: 1px solid #d9e0e8;
            padding: 10px;
            text-align: left;
          }
          th {
            background: #eaf0f6;
            color: #183b64;
          }
          .point {
            background: #eef4fa;
            border-left: 4px solid #315b83;
            padding: 15px 18px;
            margin: 18px 0;
          }
          li { margin: 7px 0; }
          .disclaimer {
            margin-top: 40px;
            padding-top: 18px;
            border-top: 1px solid #d9e0e8;
            color: #68778a;
            font-size: 12px;
          }
          @media(max-width:600px) {
            body { padding: 8px; }
            .report { padding: 18px; }
            h1 { font-size: 24px; }
            table { font-size: 12px; }
            th, td { padding: 6px; }
          }
          """

          html = f"""<!DOCTYPE html>
          <html lang="ja">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>日本株 朝の相場レポート {date}</title>
          <style>{css}</style>
          </head>
          <body>
          <main class="report">
          <header class="report-header">
          <div class="brand">MARKET MORNING REPORT</div>
          <h1>日本株 朝の相場レポート</h1>
          <div class="date">{date}</div>
          <p>国内外の市場動向と本日の投資戦略</p>
          </header>
          <p>[:contents]</p>
          {body}
          <footer class="disclaimer">
          本レポートは情報提供を目的として作成しています。
          投資判断はご自身の責任で行ってください。
          </footer>
          </main>
          </body>
          </html>"""

          with open("report.html", "w", encoding="utf-8") as f:
              f.write(html)

          print("レポート生成完了")
          print("章数:", len(chapters))
          print("文字数:", len(html))
          PY

          python generate.py

      - name: Check generated report
        run: |
          test -s report.html
          echo "HTML report generated successfully."

      - name: Save Hatena draft
        env:
          OWNER_API_KEY: ${{ secrets.OWNER_API_KEY }}
          BLOG_DOMAIN: ${{ secrets.BLOG_DOMAIN }}
        run: |
          python3 <<'PY'
          import os
          import sys
          import base64
          import html.parser
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET

          with open("report.html", encoding="utf-8") as f:
              report = f.read()

          class TitleParser(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.title = ""
                  self.active = False

              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "title":
                      self.active = True

              def handle_endtag(self, tag):
                  if tag.lower() == "title":
                      self.active = False

              def handle_data(self, data):
                  if self.active:
                      self.title += data

          parser = TitleParser()
          parser.feed(report)
          title = parser.title.strip()

          atom = "http://www.w3.org/2005/Atom"
          app = "http://www.w3.org/2007/app"

          ET.register_namespace("", atom)
          ET.register_namespace("app", app)

          entry = ET.Element(f"{{{atom}}}entry")
          ET.SubElement(entry, f"{{{atom}}}title").text = title

          author = ET.SubElement(entry, f"{{{atom}}}author")
          ET.SubElement(author, f"{{{atom}}}name").text = "Pisao"

          ET.SubElement(
              entry,
              f"{{{atom}}}content",
              {"type": "text/html"}
          ).text = report

          control = ET.SubElement(entry, f"{{{app}}}control")
          ET.SubElement(control, f"{{{app}}}draft").text = "yes"

          body = ET.tostring(
              entry,
              encoding="utf-8",
              xml_declaration=True
          )

          key = os.environ["OWNER_API_KEY"]
          domain = os.environ["BLOG_DOMAIN"]

          endpoint = (
              f"https://blog.hatena.ne.jp/Pisao/{domain}/atom/entry"
          )

          token = base64.b64encode(
              f"Pisao:{key}".encode()
          ).decode()

          request = urllib.request.Request(
              endpoint,
              data=body,
              headers={
                  "Authorization": f"Basic {token}",
                  "Content-Type": "application/atom+xml; charset=utf-8"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  print("Hatena下書き保存成功:", response.status)
          except urllib.error.HTTPError as error:
              print("Hatena API error:", error.code)
              print(error.read().decode("utf-8", errors="replace"))
              sys.exit(1)
          PY
