
name: Japanese Stock Market Report - Hatena Draft

on:
  workflow_dispatch:
  schedule:
    - cron: '30 22 * * 0-4'

permissions:
  contents: read

jobs:
  post-to-hatena:
    name: Post report to Hatena Draft
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify report HTML
        run: |
          if [ ! -s report.html ]; then
            echo "Error: report.html is missing or empty."
            exit 1
          fi

      - name: Create Hatena draft
        env:
          OWNER_API_KEY: ${{ secrets.OWNER_API_KEY }}
          BLOG_DOMAIN: ${{ secrets.BLOG_DOMAIN }}
        run: |
          python3 - <<'PY'
          import os
          import base64
          import urllib.request
          import xml.etree.ElementTree as ET

          api_key = os.environ["OWNER_API_KEY"]
          blog_domain = os.environ["BLOG_DOMAIN"]

          with open("report.html", encoding="utf-8") as f:
              html = f.read()

          title = "日本株 朝の相場レポート"

          atom = "http://www.w3.org/2005/Atom"
          app = "http://www.w3.org/2007/app"

          ET.register_namespace("", atom)
          ET.register_namespace("app", app)

          entry = ET.Element(f"{{{atom}}}entry")

          title_element = ET.SubElement(
              entry, f"{{{atom}}}title"
          )
          title_element.text = title

          content = ET.SubElement(
              entry, f"{{{atom}}}content"
          )
          content.set("type", "text/html")
          content.text = html

          control = ET.SubElement(
              entry, f"{{{app}}}control"
          )
          draft = ET.SubElement(
              control, f"{{{app}}}draft"
          )
          draft.text = "yes"

          payload = ET.tostring(
              entry,
              encoding="utf-8",
              xml_declaration=True
          )

          url = (
              "https://blog.hatena.ne.jp/Pisao/"
              + blog_domain
              + "/atom/entry"
          )

          token = base64.b64encode(
              f"Pisao:{api_key}".encode()
          ).decode()

          request = urllib.request.Request(
              url,
              data=payload,
              headers={
                  "Authorization": "Basic " + token,
                  "Content-Type": "application/atom+xml; charset=utf-8"
              },
              method="POST"
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              print("Hatena API status:", response.status)
              print(response.read().decode("utf-8"))
          PY
