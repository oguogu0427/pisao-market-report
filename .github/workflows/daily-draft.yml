
name: Japanese Stock Market Report

on:
  repository_dispatch:
    types:
      - stock-report-ready

  workflow_dispatch:

  schedule:
    - cron: '30 22 * * 0-4'

permissions:
  contents: read

concurrency:
  group: japanese-stock-market-report
  cancel-in-progress: false

jobs:
  save-hatena-draft:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare report HTML
        env:
          EVENT_PATH: ${{ github.event_path }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import pathlib

          event_name = os.environ["EVENT_NAME"]

          if event_name == "repository_dispatch":
              with open(os.environ["EVENT_PATH"], encoding="utf-8") as f:
                  event = json.load(f)

              report = event.get("client_payload", {}).get("report_html", "")

              if not isinstance(report, str) or not report.strip():
                  raise RuntimeError("ChatGPTから受信したHTML本文が空です")

              pathlib.Path("report.html").write_text(
                  report, encoding="utf-8"
              )
          else:
              report_path = pathlib.Path("report.html")

              if not report_path.is_file() or not report_path.stat().st_size:
                  raise RuntimeError("投稿対象のレポート本文がありません")

          print("HTML report prepared successfully")
          PY

      - name: Create Hatena AtomPub entry
        env:
          HATENA_USER: Pisao
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from datetime import datetime
          from zoneinfo import ZoneInfo

          atom = "http://www.w3.org/2005/Atom"
          app = "http://www.w3.org/2007/app"

          ET.register_namespace("", atom)
          ET.register_namespace("app", app)

          def q(ns, name):
              return f"{{{ns}}}{name}"

          with open("report.html", encoding="utf-8") as f:
              report = f.read()

          if not report.strip():
              raise RuntimeError("HTML本文が空です")

          now = datetime.now(ZoneInfo("Asia/Tokyo"))
          title = "日本株 朝の相場レポート " + now.strftime("%Y年%m月%d日")

          entry = ET.Element(q(atom, "entry"))
          ET.SubElement(entry, q(atom, "title")).text = title

          author = ET.SubElement(entry, q(atom, "author"))
          ET.SubElement(author, q(atom, "name")).text = os.environ["HATENA_USER"]

          content = ET.SubElement(entry, q(atom, "content"))
          content.set("type", "html")
          content.text = report

          control = ET.SubElement(entry, q(app, "control"))
          ET.SubElement(control, q(app, "draft")).text = "yes"

          ET.ElementTree(entry).write(
              "hatena-entry.xml",
              encoding="utf-8",
              xml_declaration=True
          )
          PY

      - name: Save HTML draft to Hatena
        env:
          HATENA_USER: Pisao
          HATENA_API_KEY: ${{ secrets.OWNER_API_KEY }}
          BLOG_DOMAIN: ${{ secrets.BLOG_DOMAIN }}
        run: |
          set -euo pipefail

          test -n "$HATENA_API_KEY"
          test -n "$BLOG_DOMAIN"

          RESPONSE=$(curl --fail-with-body --silent --show-error \
            --user "${HATENA_USER}:${HATENA_API_KEY}" \
            --request POST \
            --header "Content-Type: application/atom+xml; charset=utf-8" \
            --data-binary @hatena-entry.xml \
            "https://blog.hatena.ne.jp/${HATENA_USER}/${BLOG_DOMAIN}/atom/entry")

          echo "$RESPONSE"
          echo "Hatena draft submission completed."
